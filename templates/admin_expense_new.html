{% extends "base.html" %}
{% block title %}New expense · {{ brand.name }}{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>New expense</h1>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Category
      <select name="category_id" required>
        {% for c in categories %}
        <option value="{{ c['id'] }}">{{ c['name'] }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Description <input name="description" required></label>
    <label>Amount <input name="amount" type="number" step="0.01" min="0" required></label>
    <label>Date <input name="expense_date" type="date" value="{{ today }}" required></label>
    <label>Supplier <input name="supplier"></label>
    <label>Reference <input name="reference"></label>
    <label>Notes <textarea name="notes" rows="2"></textarea></label>
    <p class="muted small">Expenses above M500 by anyone, or any amount by a supervisor, require approval by a manager, executive, or administrator.</p>
    <button class="btn" type="submit">Save expense</button>
  </form>
</section>
{% endblock %}
