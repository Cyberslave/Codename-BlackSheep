{% extends "base.html" %}
{% block title %}New product · {{ brand.name }}{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>New product or service</h1>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Name <input name="name" required autofocus></label>
    <label>Description <textarea name="description" rows="2"></textarea></label>
    <label>Price <input name="price" type="number" step="0.01" min="0" value="0" required></label>
    <label class="check"><input type="checkbox" name="is_service" value="1"> This is a service</label>
    <button class="btn" type="submit">Add</button>
  </form>
</section>
{% endblock %}
