<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }} · {{ brand.name }}</title>
<style>
  body{font-family:Georgia,serif;max-width:820px;margin:2rem auto;color:#111;line-height:1.5;padding:0 1rem}
  h1,h2{font-family:Helvetica,Arial,sans-serif}
  table{font-size:.95em}
  th,td{padding:.4em .6em;border-bottom:1px solid #eee}
  @media print{ body{margin:0;padding:0} .no-print{display:none} }
</style>
</head>
<body>
<div class="no-print" style="text-align:right;margin-bottom:1em">
  <button onclick="window.print()">Print / Save as PDF</button>
</div>
<article>{{ body|safe }}</article>
</body>
</html>
